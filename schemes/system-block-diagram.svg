<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 620" width="1140" height="620" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1140" height="620" fill="#ffffff"/>

  <text x="30" y="38" font-size="22" font-weight="bold" fill="#111827">System block diagram — one loop, 30 times a second</text>
  <text x="30" y="60" font-size="14" fill="#4b5563">Everything left of the serial link runs on the Raspberry Pi 5. Everything right of it runs on the ESP32 and keeps running if the Pi does not.</text>

  <!-- ============ PI SIDE ============ -->
  <rect x="30" y="86" width="600" height="490" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="46" y="110" font-size="14" font-weight="bold" fill="#065f46">RASPBERRY PI 5 — sees and decides</text>

  <rect x="50" y="126" width="250" height="70" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="175" y="150" font-size="14" font-weight="bold" text-anchor="middle" fill="#064e3b">camera.py</text>
  <text x="175" y="170" font-size="12" text-anchor="middle" fill="#065f46">USB camera, MJPG 30 fps</text>
  <text x="175" y="186" font-size="12" text-anchor="middle" fill="#065f46">same code on Windows and Pi</text>

  <rect x="330" y="126" width="280" height="70" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="470" y="150" font-size="14" font-weight="bold" text-anchor="middle" fill="#064e3b">geometria.py</text>
  <text x="470" y="170" font-size="12" text-anchor="middle" fill="#065f46">pixels → millimetres on the floor</text>
  <text x="470" y="186" font-size="12" text-anchor="middle" fill="#065f46">horizon · wheel corridor</text>

  <rect x="50" y="216" width="170" height="86" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="135" y="240" font-size="14" font-weight="bold" text-anchor="middle" fill="#064e3b">muro.py</text>
  <text x="135" y="260" font-size="12" text-anchor="middle" fill="#065f46">floor → not-floor</text>
  <text x="135" y="276" font-size="12" text-anchor="middle" fill="#065f46">transition, fitted lines,</text>
  <text x="135" y="292" font-size="12" text-anchor="middle" fill="#065f46">corridor in mm</text>

  <rect x="235" y="216" width="170" height="86" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="320" y="240" font-size="14" font-weight="bold" text-anchor="middle" fill="#064e3b">vision.py</text>
  <text x="320" y="260" font-size="12" text-anchor="middle" fill="#065f46">HSV masks, blob merge</text>
  <text x="320" y="276" font-size="12" text-anchor="middle" fill="#065f46">red / green pillars,</text>
  <text x="320" y="292" font-size="12" text-anchor="middle" fill="#065f46">orange / blue lines</text>

  <rect x="420" y="216" width="190" height="86" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="515" y="240" font-size="14" font-weight="bold" text-anchor="middle" fill="#064e3b">lineas.py</text>
  <text x="515" y="260" font-size="12" text-anchor="middle" fill="#065f46">direction of the round,</text>
  <text x="515" y="276" font-size="12" text-anchor="middle" fill="#065f46">corner opens / closes,</text>
  <text x="515" y="292" font-size="12" text-anchor="middle" fill="#065f46">lap count</text>

  <rect x="50" y="322" width="270" height="104" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="185" y="346" font-size="14" font-weight="bold" text-anchor="middle" fill="#064e3b">navegacion.py — state machine</text>
  <text x="185" y="368" font-size="12" text-anchor="middle" fill="#065f46">STRAIGHT → PRE-TURN → TURN 90</text>
  <text x="185" y="386" font-size="12" text-anchor="middle" fill="#065f46">TWO-STAGE TURN · COLOUR TURN</text>
  <text x="185" y="404" font-size="12" text-anchor="middle" fill="#065f46">ESCAPE (the only one that reverses)</text>
  <text x="185" y="420" font-size="12" text-anchor="middle" fill="#065f46">heading held by the gyro</text>

  <rect x="340" y="322" width="270" height="104" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="475" y="346" font-size="14" font-weight="bold" text-anchor="middle" fill="#064e3b">obstaculos.py</text>
  <text x="475" y="368" font-size="12" text-anchor="middle" fill="#065f46">red → pass on its right</text>
  <text x="475" y="386" font-size="12" text-anchor="middle" fill="#065f46">green → pass on its left</text>
  <text x="475" y="404" font-size="12" text-anchor="middle" fill="#065f46">overtaking commitment,</text>
  <text x="475" y="420" font-size="12" text-anchor="middle" fill="#065f46">gives way to the wall</text>

  <rect x="50" y="446" width="270" height="76" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="185" y="470" font-size="14" font-weight="bold" text-anchor="middle" fill="#064e3b">carrera.py — race director</text>
  <text x="185" y="490" font-size="12" text-anchor="middle" fill="#065f46">3 laps, 12 corners, stop in the</text>
  <text x="185" y="506" font-size="12" text-anchor="middle" fill="#065f46">finish section, 3-minute cap</text>

  <rect x="340" y="446" width="270" height="76" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="475" y="470" font-size="14" font-weight="bold" text-anchor="middle" fill="#064e3b">servidor.py — web panel</text>
  <text x="475" y="490" font-size="12" text-anchor="middle" fill="#065f46">bench and practice only;</text>
  <text x="475" y="506" font-size="12" text-anchor="middle" fill="#065f46">shut down for the round</text>

  <text x="50" y="548" font-size="12" fill="#065f46">tools/selftest.py — 295 checks that run on any laptop, with no camera and no car</text>
  <text x="50" y="566" font-size="12" fill="#065f46">params.py — every knob, self-documented; adding one makes it appear in the panel by itself</text>

  <!-- arrows inside PI -->
  <line x1="300" y1="160" x2="330" y2="160" stroke="#047857" stroke-width="2" marker-end="url(#g)"/>
  <line x1="175" y1="196" x2="175" y2="216" stroke="#047857" stroke-width="2" marker-end="url(#g)"/>
  <line x1="470" y1="196" x2="470" y2="216" stroke="#047857" stroke-width="2" marker-end="url(#g)"/>
  <line x1="185" y1="302" x2="185" y2="322" stroke="#047857" stroke-width="2" marker-end="url(#g)"/>
  <line x1="475" y1="302" x2="475" y2="322" stroke="#047857" stroke-width="2" marker-end="url(#g)"/>
  <line x1="340" y1="374" x2="320" y2="374" stroke="#047857" stroke-width="2" marker-end="url(#g)"/>
  <line x1="185" y1="426" x2="185" y2="446" stroke="#047857" stroke-width="2" marker-end="url(#g)"/>

  <!-- ============ LINK ============ -->
  <rect x="656" y="240" width="120" height="150" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="716" y="266" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">SERIAL LINK</text>
  <text x="716" y="288" font-size="12" text-anchor="middle" fill="#1e40af">115200 baud</text>
  <text x="716" y="306" font-size="12" text-anchor="middle" fill="#1e40af">binary frame</text>
  <text x="716" y="324" font-size="12" text-anchor="middle" fill="#1e40af">+ CRC</text>
  <text x="716" y="346" font-size="12" text-anchor="middle" fill="#1e40af">100 Hz down</text>
  <text x="716" y="364" font-size="12" text-anchor="middle" fill="#1e40af">20/40 Hz up</text>
  <line x1="630" y1="300" x2="656" y2="300" stroke="#1d4ed8" stroke-width="2" marker-end="url(#b)"/>
  <line x1="776" y1="300" x2="802" y2="300" stroke="#1d4ed8" stroke-width="2" marker-end="url(#b)"/>
  <line x1="776" y1="340" x2="802" y2="340" stroke="#1d4ed8" stroke-width="2" marker-start="url(#b)"/>
  <text x="700" y="404" font-size="11" text-anchor="middle" fill="#1e40af">counters, not events:</text>
  <text x="700" y="420" font-size="11" text-anchor="middle" fill="#1e40af">a dropped frame never</text>
  <text x="700" y="436" font-size="11" text-anchor="middle" fill="#1e40af">loses a line crossing</text>

  <!-- ============ ESP32 SIDE ============ -->
  <rect x="802" y="86" width="308" height="490" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="818" y="110" font-size="14" font-weight="bold" fill="#1e3a8a">ESP32 — moves and protects</text>

  <rect x="822" y="126" width="268" height="86" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="956" y="150" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a8a">sensor task (core 0)</text>
  <text x="956" y="170" font-size="12" text-anchor="middle" fill="#1e40af">MPU-6050 → yaw, integrated with</text>
  <text x="956" y="186" font-size="12" text-anchor="middle" fill="#1e40af">the real dt between INT edges</text>
  <text x="956" y="202" font-size="12" text-anchor="middle" fill="#1e40af">TCS34725 → floor line crossings</text>

  <rect x="822" y="232" width="268" height="86" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="956" y="256" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a8a">control task (core 1, 10 ms)</text>
  <text x="956" y="276" font-size="12" text-anchor="middle" fill="#1e40af">ramps on motor and steering</text>
  <text x="956" y="292" font-size="12" text-anchor="middle" fill="#1e40af">servo limits applied three times</text>
  <text x="956" y="308" font-size="12" text-anchor="middle" fill="#1e40af">reversal pause on the motor</text>

  <rect x="822" y="338" width="268" height="76" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="956" y="362" font-size="14" font-weight="bold" text-anchor="middle" fill="#7f1d1d">watchdog task</text>
  <text x="956" y="382" font-size="12" text-anchor="middle" fill="#991b1b">Pi quiet 300 ms → motor stops</text>
  <text x="956" y="398" font-size="12" text-anchor="middle" fill="#991b1b">control quiet 200 ms → motor stops</text>

  <rect x="822" y="434" width="128" height="76" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="886" y="458" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">IBT-2</text>
  <text x="886" y="476" font-size="12" text-anchor="middle" fill="#1e293b">→ DC motor</text>
  <text x="886" y="492" font-size="12" text-anchor="middle" fill="#1e293b">20 kHz PWM</text>

  <rect x="962" y="434" width="128" height="76" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="1026" y="458" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">MG996R</text>
  <text x="1026" y="476" font-size="12" text-anchor="middle" fill="#1e293b">→ steering rack</text>
  <text x="1026" y="492" font-size="12" text-anchor="middle" fill="#1e293b">Ackermann</text>

  <line x1="956" y1="212" x2="956" y2="232" stroke="#1d4ed8" stroke-width="2" marker-end="url(#b)"/>
  <line x1="886" y1="318" x2="886" y2="434" stroke="#334155" stroke-width="2" marker-end="url(#s)"/>
  <line x1="1026" y1="318" x2="1026" y2="434" stroke="#334155" stroke-width="2" marker-end="url(#s)"/>

  <text x="818" y="540" font-size="12" fill="#1e3a8a">The car always boots disarmed. Nothing moves until the team arms it.</text>
  <text x="818" y="558" font-size="12" fill="#1e3a8a">No Wi-Fi stack is compiled into this firmware at all.</text>

  <defs>
    <marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#047857"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1d4ed8"/></marker>
    <marker id="s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker>
  </defs>
</svg>
