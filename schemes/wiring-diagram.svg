<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" width="1120" height="780" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1120" height="780" fill="#ffffff"/>

  <text x="30" y="38" font-size="22" font-weight="bold" fill="#111827">GreenTech Momboy — WRO 2026 Future Engineers</text>
  <text x="30" y="60" font-size="14" fill="#4b5563">Wiring diagram. Pin numbers read from the firmware we flash (main/firmware/esp32, identical to fallback/).</text>

  <!-- legend -->
  <g font-size="12" fill="#374151">
    <line x1="760" y1="34" x2="800" y2="34" stroke="#dc2626" stroke-width="3"/>
    <text x="806" y="38">power</text>
    <line x1="880" y1="34" x2="920" y2="34" stroke="#1f2937" stroke-width="2"/>
    <text x="926" y="38">signal</text>
    <line x1="990" y1="34" x2="1030" y2="34" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="1036" y="38">data</text>
    <line x1="760" y1="56" x2="800" y2="56" stroke="#6b7280" stroke-width="2" stroke-dasharray="2 4"/>
    <text x="806" y="60">common ground</text>
  </g>

  <!-- ================= POWER COLUMN ================= -->
  <rect x="30" y="330" width="180" height="86" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="120" y="360" font-size="15" font-weight="bold" text-anchor="middle" fill="#7f1d1d">BATTERY PACK</text>
  <text x="120" y="380" font-size="12" text-anchor="middle" fill="#7f1d1d">chemistry / cells: TODO</text>
  <text x="120" y="398" font-size="12" text-anchor="middle" fill="#7f1d1d">capacity: TODO</text>

  <rect x="30" y="460" width="180" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="120" y="484" font-size="15" font-weight="bold" text-anchor="middle" fill="#78350f">MAIN SWITCH</text>
  <text x="120" y="504" font-size="12" text-anchor="middle" fill="#78350f">the only power switch (rules)</text>

  <rect x="30" y="566" width="180" height="74" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="120" y="592" font-size="15" font-weight="bold" text-anchor="middle" fill="#7f1d1d">5 V REGULATOR</text>
  <text x="120" y="612" font-size="12" text-anchor="middle" fill="#7f1d1d">model / current: TODO</text>
  <text x="120" y="630" font-size="12" text-anchor="middle" fill="#7f1d1d">feeds Pi + servo</text>

  <!-- battery -> switch -->
  <line x1="120" y1="416" x2="120" y2="460" stroke="#dc2626" stroke-width="3"/>
  <text x="128" y="442" font-size="11" fill="#7f1d1d">VBAT+</text>
  <!-- switch -> regulator -->
  <line x1="120" y1="520" x2="120" y2="566" stroke="#dc2626" stroke-width="3"/>

  <!-- ================= CAMERA ================= -->
  <rect x="250" y="86" width="250" height="66" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="375" y="110" font-size="15" font-weight="bold" text-anchor="middle" fill="#312e81">USB CAMERA</text>
  <text x="375" y="130" font-size="12" text-anchor="middle" fill="#312e81">WN-L1812.K56R (IMX179), UVC</text>
  <text x="375" y="146" font-size="12" text-anchor="middle" fill="#312e81">MJPG, 30 fps — h = 125 mm, tilt 7.5°</text>

  <!-- ================= RASPBERRY PI ================= -->
  <rect x="250" y="186" width="250" height="130" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="375" y="212" font-size="16" font-weight="bold" text-anchor="middle" fill="#064e3b">RASPBERRY PI 5 (8 GB)</text>
  <text x="375" y="234" font-size="12" text-anchor="middle" fill="#065f46">perception + decisions</text>
  <text x="375" y="252" font-size="12" text-anchor="middle" fill="#065f46">Python 3.11 · OpenCV · NumPy</text>
  <text x="262" y="278" font-size="12" fill="#065f46">USB-C 5 V</text>
  <text x="262" y="296" font-size="12" fill="#065f46">USB-A ×2 (camera, ESP32)</text>
  <text x="262" y="312" font-size="12" fill="#065f46">GPIO 14/15 (spare UART link)</text>

  <!-- camera -> pi -->
  <line x1="375" y1="152" x2="375" y2="186" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="384" y="174" font-size="11" fill="#1e40af">USB 2.0</text>

  <!-- regulator -> pi (left route) -->
  <polyline points="210,590 232,590 232,272 250,272" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="238" y="330" font-size="11" fill="#7f1d1d" transform="rotate(-90 238,330)">5 V to Pi USB-C</text>

  <!-- ================= ESP32 ================= -->
  <rect x="250" y="378" width="250" height="330" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="375" y="404" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e3a8a">ESP32</text>
  <text x="375" y="424" font-size="12" text-anchor="middle" fill="#1e40af">hardware controller + failsafe</text>
  <text x="375" y="442" font-size="12" text-anchor="middle" fill="#1e40af">FreeRTOS · no Wi-Fi in the binary</text>
  <line x1="266" y1="456" x2="484" y2="456" stroke="#93c5fd" stroke-width="1"/>
  <g font-size="12" fill="#1e3a8a">
    <text x="266" y="478">GPIO 25  RPWM</text>
    <text x="266" y="498">GPIO 26  LPWM</text>
    <text x="266" y="518">GPIO 27  R_EN</text>
    <text x="266" y="538">GPIO 33  L_EN</text>
    <text x="266" y="558">GPIO 32  SERVO</text>
    <text x="266" y="578">GPIO 21  SDA</text>
    <text x="266" y="598">GPIO 22  SCL</text>
    <text x="266" y="618">GPIO 19  INT TCS</text>
    <text x="266" y="638">GPIO 18  INT MPU</text>
    <text x="266" y="658">GPIO 16/17  UART2</text>
    <text x="266" y="678">GPIO 13  BOTON  ·  GPIO 2  LED</text>
    <text x="266" y="700">USB  ← link + 5 V from the Pi</text>
  </g>

  <!-- Pi <-> ESP32 -->
  <line x1="375" y1="316" x2="375" y2="378" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="384" y="340" font-size="11" fill="#1e40af">USB serial 115200</text>
  <text x="384" y="356" font-size="11" fill="#1e40af">binary frames + CRC</text>

  <!-- ================= MPU ================= -->
  <rect x="600" y="176" width="200" height="70" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="700" y="202" font-size="15" font-weight="bold" text-anchor="middle" fill="#4c1d95">MPU-6050</text>
  <text x="700" y="222" font-size="12" text-anchor="middle" fill="#5b21b6">yaw · I2C 0x68</text>
  <text x="700" y="238" font-size="12" text-anchor="middle" fill="#5b21b6">INT = data ready (200 Hz)</text>

  <!-- ================= TCS ================= -->
  <rect x="600" y="276" width="200" height="70" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="700" y="302" font-size="15" font-weight="bold" text-anchor="middle" fill="#4c1d95">TCS34725</text>
  <text x="700" y="322" font-size="12" text-anchor="middle" fill="#5b21b6">floor colour · I2C 0x29</text>
  <text x="700" y="338" font-size="12" text-anchor="middle" fill="#5b21b6">INT = line edge, latched</text>

  <!-- I2C bus -->
  <polyline points="500,588 545,588 545,211 600,211" fill="none" stroke="#1f2937" stroke-width="2"/>
  <polyline points="545,311 600,311" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="552" y="404" font-size="11" fill="#111827">I2C 400 kHz (SDA/SCL)</text>
  <!-- INT lines -->
  <polyline points="500,628 570,628 570,346 620,346" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="4 3"/>
  <polyline points="500,638 578,638 578,246 640,246" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="586" y="470" font-size="11" fill="#111827">INT 19 / INT 18</text>

  <!-- ================= IBT-2 ================= -->
  <rect x="600" y="430" width="210" height="130" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="705" y="456" font-size="15" font-weight="bold" text-anchor="middle" fill="#7c2d12">IBT-2 (BTS7960)</text>
  <text x="705" y="476" font-size="12" text-anchor="middle" fill="#9a3412">H-bridge · PWM 20 kHz, 8-bit</text>
  <text x="612" y="500" font-size="12" fill="#9a3412">RPWM · LPWM · R_EN · L_EN</text>
  <text x="612" y="520" font-size="12" fill="#9a3412">B+ / B−  ← battery</text>
  <text x="612" y="540" font-size="12" fill="#9a3412">M+ / M−  → motor</text>

  <!-- ESP32 -> IBT2 (4 control lines bundled) -->
  <polyline points="500,478 530,478 530,494 600,494" fill="none" stroke="#1f2937" stroke-width="2"/>
  <polyline points="500,498 530,498" fill="none" stroke="#1f2937" stroke-width="2"/>
  <polyline points="500,518 530,518" fill="none" stroke="#1f2937" stroke-width="2"/>
  <polyline points="500,538 530,538 530,498" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="534" y="466" font-size="11" fill="#111827">4 control lines</text>

  <!-- battery -> IBT2 power (route along the bottom) -->
  <polyline points="120,416 120,430 226,430 226,742 866,742 866,560" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="470" y="736" font-size="11" fill="#7f1d1d">VBAT to the H-bridge (B+/B−), taken after the main switch</text>
  <polyline points="866,560 810,545" fill="none" stroke="#dc2626" stroke-width="3"/>

  <!-- ================= MOTOR ================= -->
  <rect x="860" y="430" width="210" height="96" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="965" y="456" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">DC MOTOR 500 rpm</text>
  <text x="965" y="476" font-size="12" text-anchor="middle" fill="#1e293b">2:1 gearing → rear axle</text>
  <text x="965" y="494" font-size="12" text-anchor="middle" fill="#1e293b">wheel Ø 65.2 mm → ≈850 mm/s</text>
  <text x="965" y="512" font-size="12" text-anchor="middle" fill="#1e293b">mechanical differential</text>
  <line x1="810" y1="478" x2="860" y2="478" stroke="#dc2626" stroke-width="3"/>

  <!-- ================= SERVO ================= -->
  <rect x="600" y="600" width="210" height="96" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="705" y="626" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">SERVO MG996R</text>
  <text x="705" y="646" font-size="12" text-anchor="middle" fill="#1e293b">rack and pinion → Ackermann</text>
  <text x="705" y="664" font-size="12" text-anchor="middle" fill="#1e293b">50 Hz, 500–2400 µs</text>
  <text x="705" y="682" font-size="12" text-anchor="middle" fill="#1e293b">limits enforced 3× in firmware</text>
  <line x1="500" y1="558" x2="560" y2="558" stroke="#1f2937" stroke-width="2"/>
  <polyline points="560,558 560,626 600,626" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="566" y="596" font-size="11" fill="#111827">GPIO 32</text>
  <!-- regulator -> servo -->
  <polyline points="210,610 226,610 226,668 600,668" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="330" y="662" font-size="11" fill="#7f1d1d">5–6 V servo rail</text>

  <!-- ground note -->
  <line x1="226" y1="758" x2="1070" y2="758" stroke="#6b7280" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="240" y="774" font-size="12" fill="#374151">Common ground: battery −, regulator −, Pi, ESP32, IBT-2 and servo all tied together. Without this the PWM and the I2C read noise.</text>

  <!-- start button + status LED -->
  <rect x="860" y="596" width="210" height="100" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
  <text x="965" y="620" font-size="15" font-weight="bold" text-anchor="middle" fill="#164e63">BUTTON + STATUS LED</text>
  <text x="965" y="640" font-size="12" text-anchor="middle" fill="#155e75">GPIO 13 —[ button ]— GND</text>
  <text x="965" y="658" font-size="12" text-anchor="middle" fill="#155e75">internal pull-up, no resistor</text>
  <text x="965" y="676" font-size="12" text-anchor="middle" fill="#155e75">press: arm/start · press: stop</text>
  <text x="965" y="692" font-size="12" text-anchor="middle" fill="#155e75">LED on GPIO 2 shows the state</text>
  <polyline points="500,678 520,678 520,726 940,726 940,696" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="640" y="720" font-size="11" fill="#111827">GPIO 13 / GPIO 2 — the cut is latched inside the ESP32 (10 ms), not in the Pi</text>
</svg>
